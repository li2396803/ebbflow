name: probe szse
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 用项目自身的 fetchSzseSnapshot
        run: |
          node --input-type=module -e '
            import { fetchSzseSnapshot } from "./lib/sources.mjs";
            const t0 = Date.now();
            try {
              const r = await fetchSzseSnapshot();
              console.log("成功 date=", r.date, "只数=", Object.keys(r.shares).length, "行=", r.count, "用时=", Date.now()-t0, "ms");
            } catch (e) {
              console.log("失败", e.message, "| cause:", e.cause?.code || e.cause?.errno || "-", "| 用时=", Date.now()-t0, "ms");
            }
          '
      - name: 再试一次（看是否间歇性）
        if: always()
        run: |
          node --input-type=module -e '
            import { fetchSzseSnapshot } from "./lib/sources.mjs";
            for (let i=1;i<=2;i++){
              const t0=Date.now();
              try { const r=await fetchSzseSnapshot(); console.log(`第${i}次 ok`, Object.keys(r.shares).length, "只", Date.now()-t0, "ms"); }
              catch(e){ console.log(`第${i}次 失败`, e.message, "| cause:", e.cause?.code||"-", Date.now()-t0, "ms"); }
            }
          '
