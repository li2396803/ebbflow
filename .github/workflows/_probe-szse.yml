name: probe szse
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 不加 ipv4first（对照）
        run: |
          node --input-type=module -e '
            import { fetchSzseSnapshot } from "./lib/sources.mjs";
            const t0=Date.now();
            try { const r=await fetchSzseSnapshot(); console.log("对照 ok", Object.keys(r.shares).length, Date.now()-t0, "ms"); }
            catch(e){ console.log("对照 失败", e.cause?.code||e.message, Date.now()-t0, "ms"); }
          '
      - name: 加 ipv4first（实验组）
        if: always()
        run: |
          node --input-type=module -e '
            import dns from "node:dns";
            dns.setDefaultResultOrder("ipv4first");
            const { fetchSzseSnapshot } = await import("./lib/sources.mjs");
            for (let i=1;i<=2;i++){
              const t0=Date.now();
              try { const r=await fetchSzseSnapshot(); console.log(`ipv4first 第${i}次 ok`, r.date, Object.keys(r.shares).length, "只", Date.now()-t0, "ms"); }
              catch(e){ console.log(`ipv4first 第${i}次 失败`, e.cause?.code||e.message, Date.now()-t0, "ms"); }
            }
          '
