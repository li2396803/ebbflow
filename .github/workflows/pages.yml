# 手动把站点发布到 GitHub Pages
#
# 日常发布不需要这个工作流：daily.yml 每天构建完会直接部署（needs: update → deploy）。
# 这里用于「改了前端 / 想立刻重发一次」的场景：Actions → Deploy site to GitHub Pages → Run workflow。
#
# 站点地址：https://li2396803.github.io/ebbflow/
# 前提：Settings → Pages → Source = GitHub Actions（仓库已配置）
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 确认 node:sqlite 可用
        run: node -e "require('node:sqlite'); console.log('node:sqlite OK', process.version)"

      # 有缓存就用完整库；没有缓存时 npm run build 会用仓库里的 data/series.json 冷启动出图
      - name: 恢复 SQLite 缓存（尽力而为）
        uses: actions/cache/restore@v4
        with:
          path: data/etf.db
          key: etf-db-v3-none-${{ github.run_id }}
          restore-keys: |
            etf-db-v3-

      - name: 构建站点
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: npm run build

      - name: 检查产物
        run: |
          test -f site/index.html || (echo "::error::缺少 site/index.html"; exit 1)
          test -f site/data/meta.json || (echo "::error::缺少 site/data/meta.json"; exit 1)
          grep -q "__SIGNATURE__" site/index.html && (echo "::error::签名占位符未替换"; exit 1) || true
          echo "站点文件数：$(find site -type f | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
