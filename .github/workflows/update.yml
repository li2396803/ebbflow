# 每交易日自动更新数据：深交所快照 + 上交所近 N 日 + Tushare 当日 → 重算序列 → 重建 site/
#
# 触发：
#   · schedule           工作日 UTC 13:30（≈ 北京时间 21:30，份额数据已更新）+ 次日 UTC 00:30 兜底
#   · workflow_dispatch  手动，可选 lookback（上交所回溯天数）
#
# 产物：site/ 下的静态站点 + site/data/*.json（会被自动提交回仓库）；
#       data/etf.db 不进 git，用 actions/cache 在两次运行之间传递。
#
# 注意：本仓库不产出 data/shares/（旧版每日原始快照），也不提交 data/etf.db —— 两者都已在 .gitignore 里。
name: Daily data update

on:
  schedule:
    # 21:30（北京时间）—— 收盘后份额数据要等数据商晚间更新，16:30 抓不到当天的。
    # 排队延迟属正常现象，早半小时晚半小时都无妨（写入是幂等的）。
    - cron: "30 13 * * 1-5"
    # 次日 08:30 兜底：晚间那次若因上游延迟没抓到，这里补一次
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      lookback:
        description: "上交所回溯天数（默认 15；调大可用于补漏跑的日子）"
        required: false
        default: "15"
        type: string

# 自动提交需要写权限
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时刻只跑一个更新，避免两个 run 抢同一份缓存/同一次提交
concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    name: 抓数 → 重算 → 构站 → 提交
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Tushare Pro token：仓库 Settings → Secrets and variables → Actions 里加同名 secret
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      # schedule 触发时 inputs 为空，回落到默认 15 天
      LOOKBACK: ${{ inputs.lookback || '15' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # node:sqlite 需要 Node ≥ 22.5（LTS 22 的最新小版本已免 --experimental-sqlite）
          node-version: "22"

      - name: 检查运行时
        run: |
          node -v
          npm -v
          # 提前确认内置 SQLite 可用，避免跑了几分钟才在写库时炸
          node -e 'const s = require("node:sqlite"); console.log("node:sqlite 可用:", Object.keys(s).join(", "))'

      - name: 检查 TUSHARE_TOKEN
        shell: bash
        run: |
          if [ -z "${TUSHARE_TOKEN:-}" ]; then
            echo "::error title=缺少 TUSHARE_TOKEN::这是 fork 出来的仓库，需要你自己配置 Tushare 密钥。"
            echo "::error::步骤：① https://tushare.pro 注册并复制 token ② 本仓库 Settings → Secrets and variables → Actions → New repository secret ③ Name 填 TUSHARE_TOKEN，Value 粘贴 token ④ 重新运行本工作流。详见 docs/FORK.md"
            exit 1
          fi
          echo "TUSHARE_TOKEN 已配置（长度 ${#TUSHARE_TOKEN}）"
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: 安装依赖
        run: |
          # 有 lockfile 时安装依赖（前端构建需要 vite / echarts；数据类脚本本身零依赖）
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --package-lock=false
          fi

      # 冷启动兜底：没有缓存时下载数据库种子（Release 资产），避免全量回补几十分钟
      - name: 数据库种子兜底
        if: hashFiles('data/etf.db') == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "没有 data/etf.db，尝试下载种子…"
          if gh release download db-seed --repo "$GITHUB_REPOSITORY" --pattern 'etf-db.sqlite.gz' --dir /tmp/seed 2>/dev/null; then
            gunzip -c /tmp/seed/etf-db.sqlite.gz > data/etf.db
            echo "::notice::已使用数据库种子恢复（$(du -h data/etf.db | cut -f1)），本次只做增量"
          else
            echo "::notice::没有可用种子，将执行全量回补（首次可能较久）"
          fi

      - name: 恢复 SQLite 缓存
        id: db-restore
        uses: actions/cache/restore@v4
        with:
          path: data/etf.db
          key: etf-db-v3-${{ github.run_id }}
          restore-keys: |
            etf-db-v3-

      - name: 报告缓存的数据库
        run: |
          if [ -f data/etf.db ]; then
            echo "已恢复 data/etf.db（$(du -h data/etf.db | cut -f1)），在其基础上增量更新"
          else
            echo "::notice::没有可恢复的 data/etf.db，本次从空库开始（深市历史只能靠 Tushare 回补）"
          fi

      # 直接调用 scripts/update.mjs 导出的 update({lookback})：
      # npm run update 的 CLI 入口固定用默认 15 天，读不到 workflow_dispatch 的 lookback 输入。
      # 失败（含被锁跳过）必须让 job 失败，绝不能"什么都没更新"却继续往下提交。
      - name: 增量更新数据
        env:
          # 冷启动（无 DB 缓存）首跑要回补 5 年历史，放宽到两个阶段都够用；日常增量只用 ~15 次
          TUSHARE_RPM: "150"
          TUSHARE_MAX_CALLS_PER_RUN: "4200"
          TUSHARE_DAILY_BUDGET: "6000"
        run: |
          set -o pipefail
          node --input-type=module -e '
            import { update } from "./scripts/update.mjs";
            const lookback = Number(process.env.LOOKBACK || 15);
            console.log("lookback =", lookback, "天");
            const r = await update({ lookback });
            console.log("update() →", JSON.stringify(r));
            if (r && r.skipped) {
              console.error("更新被互斥锁跳过（" + r.skipped + "），视为失败");
              process.exit(1);
            }
          ' 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: 校验前端产物
        shell: bash
        run: |
          set -e
          ls site/assets/index-*.js >/dev/null || { echo "::error::前端产物缺失：vite 构建没有生效"; exit 1; }
          test -f site/sw.js || { echo "::error::缺少 site/sw.js"; exit 1; }
          echo "前端产物就绪：$(ls site/assets | wc -l) 个文件"

      - name: 跑数据校验测试
        run: npm test

      - name: 打印更新结果
        run: |
          echo "── data/lastrun.json ──"
          cat data/lastrun.json 2>/dev/null || echo "(缺失)"
          echo
          echo "── site/data/meta.json ──"
          if [ -f site/data/meta.json ]; then
            node -e '
              const m = require("./site/data/meta.json");
              console.log("lastTradeDate:", m.lastTradeDate);
              console.log("区间:", m.range && (m.range.from + " ~ " + m.range.to + "（" + m.range.days + " 个交易日）"));
              console.log("规模:", JSON.stringify(m.counts));
              if (m.warnings && m.warnings.length) console.log("告警:", m.warnings.join(" | "));
            '
          else
            echo "✗ 缺少 site/data/meta.json"
            exit 1
          fi

      # WAL 模式下最新事务可能还留在 data/etf.db-wal 里；不 checkpoint 就只缓存主文件会丢数据
      - name: checkpoint WAL（保证缓存的是完整数据库）
        if: success()
        run: |
          if [ -f data/etf.db ]; then
            node -e '
              const { DatabaseSync } = require("node:sqlite");
              const db = new DatabaseSync("data/etf.db");
              db.exec("PRAGMA wal_checkpoint(TRUNCATE)");
              db.close();
              console.log("wal_checkpoint(TRUNCATE) ok");
            '
          else
            echo "没有 data/etf.db，跳过"
          fi

      - name: 看看改了什么
        run: |
          git status --porcelain
          echo "── git diff --stat ──"
          git diff --stat

      - name: 三源交叉校验（保持 quality.json 新鲜）
        if: success() && github.ref == 'refs/heads/master'
        continue-on-error: true
        run: npm run reconcile -- --days 5 || echo "::warning::交叉校验未通过或不可用，继续提交流程"

      # 只提交站点与载荷 JSON。data/etf.db、data/shares/、data/lastrun.json 都在 .gitignore 里。
      # 这里故意写显式文件名而不用 data/*.json：shell 会先把 data/*.json 展开成真实文件名
      # （其中包含被忽略的 data/lastrun.json），而 git add 一个被忽略的路径会以退出码 1 失败。
      # 用原生 git 提交；遇到并发推送时 rebase 重试，数据文件冲突一律以「本次 CI 生成的结果」为准
      - name: 提交站点数据
        if: success() && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          git config user.name "etf-flow bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site data/series.json data/quality.json
          if git diff --cached --quiet; then
            echo "没有需要提交的数据变化"
            exit 0
          fi
          git commit -m "chore(data): 自动更新站点数据"

          # 生成物（series/quality/site）每次都会被本 job 重写，冲突时取本 job 的版本即可
          resolve_generated() {
            git checkout --theirs -- data/quality.json data/series.json 2>/dev/null || true
            git checkout --theirs -- site 2>/dev/null || true
            git add -A data/series.json data/quality.json site 2>/dev/null || true
          }

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" 2>/dev/null; then
              if git push origin "HEAD:$BR"; then echo "已推送（第 $i 次尝试）"; exit 0; fi
            else
              echo "rebase 冲突，保留本次生成的数据后继续"
              resolve_generated
              GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; }
              if git push origin "HEAD:$BR"; then echo "已推送（解决冲突后，第 $i 次尝试）"; exit 0; fi
            fi
            echo "第 $i 次未成功，3 秒后重试…"
            sleep 3
          done
          echo "::error::连续多次推送失败"
          exit 1

      # 把构建好的静态站点打成可下载产物：从 Actions 页面下载 zip 即可离线打开/托管
      - name: 上传站点产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.run_id }}
          path: site
          if-no-files-found: warn
          retention-days: 30

      # 公开站点：直接用这次刚构建好的 site/ 发布到 GitHub Pages（无需二次构建）
      - name: 配置 Pages
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 保存 SQLite 缓存
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: data/etf.db
          key: etf-db-v3-${{ github.run_id }}

      - name: 上传更新日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: ${{ runner.temp }}/update.log
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: update
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
