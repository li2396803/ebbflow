name: 数据问题
description: 某个小类/某天的数值不对、缺失、或与其他平台不一致
title: "[Data] <小类> <日期> "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        **必填项请尽量填全**：小类、日期、期望值、实际值、`data/quality.json` 片段 ——
        缺任何一项都很难复算，维护者大概率只能回复「无法定位」。

        贴之前先确认这几件事（能自己排掉一半问题）：
        1. 是不是口径差异？看板主口径是**份额（亿份）**，金额口径（规模/净流入）是按净值折算的估算值 —— 两者不能直接比。
        2. 是不是原站冻结日？`2026-08-25` 与 `2026-10-28` 原站数值停滞，本项目从交易所重抓，本来就不同（见 `docs/DATA.md` §7）。
        3. 是不是 `501307` 这类永久空成分？（Tushare 无当日份额，贡献恒为 0）
  - type: input
    id: sub
    attributes:
      label: 细分行业（小类）
      description: 用看板上的完整名称，例如「科创板宽基」「港红利股息」。
      placeholder: 科创板宽基
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 日期
      description: 必须是一个有数据的交易日（格式 YYYY-MM-DD）。非交易日请说明。
      placeholder: "2026-11-20"
    validations:
      required: true
  - type: dropdown
    id: metric
    attributes:
      label: 哪个数值有问题
      options:
        - 主口径：细分行业值（亿份，图表 / 排行）
        - 规模（亿元，抽屉里的估算值）
        - 净流入（亿元，抽屉里的估算值）
        - 成分 ETF 明细（份额 / 净值 / 覆盖率）
        - 大类汇总或排行
        - 其他
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: 期望值
      description: 你依据什么认为它应该是这个值（原站截图 / 交易所页面 / 自己按公式算的）。
      placeholder: "例如 2084.3683（亿份），依据：按 docs/DATA.md §1 公式用 75 只成分算得"
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: 实际值（本项目显示的）
      placeholder: "例如 2079.12（亿份）"
    validations:
      required: true
  - type: textarea
    id: quality
    attributes:
      label: data/quality.json 片段
      description: |
        打开 `data/quality.json`，找到对应日期的 `days[].seriesCheck[]` 里这一项，
        把那个对象贴进来（含 `exchange` / `ts` / `covered` / `relPct` / `note`）。
        看不到对应日期时，请贴 `summary` 段并说明。
      render: json
      placeholder: |
        {
          "sub": "科创板宽基",
          "status": "both",
          "exchange": 2084.368,
          "ts": 2084.368,
          "covered": 75,
          "relPct": 0,
          "inconsistent": false,
          "note": "一致（偏离 0%，公共成分 75 只）"
        }
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 你的复算方式 / 数据来源
      description: |
        例如：上交所接口 `STAT_DATE=2026-11-20`、Tushare `fund_share`、
        或「直接拿仓库里 `data/series.json` 的对应值对比」。不要贴 token。
      placeholder: |
        curl 'http://query.sse.com.cn/commonQuery.do?...&STAT_DATE=2026-11-20'
        → 75 只成分的 TOT_VOL 之和 / 1e4 = 2084.3683
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Node 版本与是否配置 TUSHARE_TOKEN
      description: 例如「v22.12.0 / 已配置」。**不要贴 token。**
      placeholder: v22.12.0，已配置
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 只有这一天这个值不对
        - 这一天多个小类都不对
        - 这个小类多天都不对
        - 只有金额口径不对（份额正常）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、相关日志、`npm run reconcile -- --date <日期>` 的输出等。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 docs/DATA.md 的「已知偏差」一节，确认不是那里已解释的情况
          required: true
        - label: 我贴出的内容不含任何 token、密钥或他人隐私
          required: true
        - label: 我没有手改过 data/series.json 里的数值（如果改过，请在补充信息里说明）
          required: true
