name: 功能建议
description: 新能力、体验改进、数据源扩展等想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚边界，能省彼此很多时间：
        - 本项目**不引入运行时依赖**（前端原生 JS，后端只用 Node 内置模块），建议方案请在这个前提下考虑；
        - 抓取频率只降不升（每日一次增量、并发 ≤ 6、Tushare 有令牌桶与预算）；
        - 不做账户体系、荐股、交易接口、付费墙。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 场景
      description: 描述痛点，不要直接跳到方案。例如「想看某一周所有小类的净流入排名」。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 具体到界面位置、命令、载荷字段或数据表；如果有替代方案也写出来。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么不用现有功能 / 不改数据字段就能解决？
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围（你的判断）
      options:
        - 前端展示（web/）
        - 数据口径 / 派生序列（lib/pipeline.mjs）
        - 数据源 / 抓取（lib/sources.mjs、lib/tushare.mjs）
        - 载荷契约（lib/payloads.mjs，属破坏性变更）
        - 站点构建 / 服务
        - 文档 / 工程化
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: 是否会改变已发布的数据数值或载荷字段
      options:
        - "否：纯展示/工具改进"
        - "是：会改变数值或字段（需要在 CHANGELOG 记录）"
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提 PR 实现（请先在此 Issue 对齐方案）
          required: false
        - label: 我可以提供数据样本 / 复现环境
          required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue 与文档，这不是重复建议
          required: true
